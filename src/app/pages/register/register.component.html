<div class="container">
    <div class="row">
        <div class="col-12">
            <section class="section-form mt-4 mb-4">
                <div class="section-form__borda-topo mb-3"></div>

                <h2>Cadastro</h2>
                <p>Faça o cadastro de sua equipe e comece a competir</p>

                <div class="section-form__etapa mb-3">
                    <span>1ª Etapa</span>
                    <p>Dados do Usuário</p>
                </div>

                <form [formGroup]="formCadastrar" class="form-cadastrar">
                    <div class="row mb-3">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label for="nome" class="form-label">Nome*</label>
                            <input type="text" class="form-control" id="nome" name="nome"
                                placeholder="Mate, igual tomate" formControlName="nome">
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label">E-mail*</label>
                            <input type="email" class="form-control" id="email" name="email"
                                placeholder="nome@exemplo.com" autocomplete="username" formControlName="email">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-12 col-md-6 mb-3 mb-md-0">
                            <label for="senha" class="form-label">Senha*</label>
                            <input type="password" class="form-control" id="senha" name="senha" placeholder="......"
                                autocomplete="new-password" formControlName="senha">
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="confirmarSenha" class="form-label">Confirmar Senha*</label>
                            <input type="password" class="form-control" id="confirmarSenha" name="confirmarSenha"
                                placeholder="......" autocomplete="new-password" formControlName="confirmarSenha">
                        </div>
                    </div>

                    <div class="section-form__etapa mt-4 mb-3">
                        <span>2ª Etapa</span>
                        <p>Dados da Equipe</p>
                    </div>

                    <div class="row">
                        <div class="col-12 col-md-5 mb-3 mb-md-0">
                            <label for="nomeEquipe" class="form-label">Nome da Equipe*</label>
                            <input type="text" class="form-control" id="nomeEquipe" name="nomeEquipe"
                                placeholder="Ex: Catchau do relâmpago" formControlName="nomeEquipe">
                        </div>

                        <div class="col-12 col-md-3 mb-3 mb-md-0">
                            <label for="categoria" class="form-label">Categoria*</label>
                            <select class="form-select" name="categoria" id="categoria"
                                aria-label="Default select example" formControlName="categoria">
                                <option [ngValue]="null" disabled>Selecione...</option>
                                <option [ngValue]="equipeCategoria.Pista">Pista</option>
                                <option [ngValue]="equipeCategoria.Rally">Rally</option>
                                <option [ngValue]="equipeCategoria.Rua">Rua</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-4">
                            <label for="qtdeIntegrantes" class="form-label">Qtde de Participantes*</label>
                            <input type="number" class="form-control" id="qtdeIntegrantes" name="qtdeIntegrantes"
                                placeholder="Ex: 2" min="2" formControlName="qtdeParticipantes" [disabled]="true" readonly>
                        </div>
                    </div>

                    <div class="section-form__adicionar-participante mt-4 mb-3">
                        <div class="section-form__etapa">
                            <span>3ª Etapa</span>
                            <p>Participantes</p>
                        </div>

                        <button type="button" class="btn-adicionar-participante" (click)="adicionaParticipante()"><i
                                class="bi bi-plus-circle"></i> Adicionar
                            Participante</button>
                    </div>

                    <div formArrayName="participantes">
                        @for (grupo of participantes.controls; track grupo) {
                        <div class="row" [formGroupName]="$index">
                            <div class="col-12 col-md-4 mb-3">
                                <label for="participante1" class="form-label">Participante #{{ $index + 1 }}</label>

                                <button class="btn-trash ms-2" type="button" (click)="excluirParticipante($index)"
                                    [disabled]="participantes.controls.length <= 3">
                                    <i class="bi bi-trash"></i>
                                </button>

                                <input type="text" class="form-control" id="participante1" name="participante1"
                                    placeholder="Ex: Catchau do relâmpago" formControlName="nomeParticipante">
                            </div>

                            <div class="col-12 col-md-4 mb-3">
                                <label for="funcao" class="form-label">Função</label>

                                <input type="text" class="form-control" id="funcao" name="funcao"
                                    placeholder="Ex: Mecânico" formControlName="funcao">
                            </div>

                            <div class="col-12 col-md-4 mb-3">
                                <label for="status" class="form-label">Status*</label>

                                <select class="form-select" name="status" id="status"
                                    aria-label="Default select example" formControlName="status">
                                    <option [ngValue]="null" disabled>Selecione...</option>
                                    <option [ngValue]="equipeStatus.Ativo">Ativo</option>
                                    <option [ngValue]="equipeStatus.Inativo">Inativo</option>
                                </select>
                            </div>
                        </div>
                        }
                    </div>

                    <div class="btn-criar-conta">
                        <button type="submit" class="btn mt-4 mb-2" [disabled]="formCadastrar.invalid"><i class="bi bi-person-fill-add"></i> Criar Conta</button>
                    </div>

                    <div class="text-center">
                        <p>
                            Já possui cadastro?
                            <a class="form-cadastrar__link" routerLink="/public/login">Clique aqui</a>
                        </p>
                    </div>
                </form>
            </section>
        </div>
    </div>
</div>
