<div class="container-fluid">
    <div class="container-fluid__header">
        <a routerLink="/competitor/my-team"><i class="bi bi-arrow-left"></i> Voltar</a>

        <h1>Nova Copa</h1>

        <div class="container-fluid__data-status">
            <p>
                Defina período, situação e pré-requisitos
            </p>

            <!-- <span class="section-cards__span-abertas">Inscrições Abertas</span> -->
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <section class="section-form ">
                <div class="section-form__borda-topo mb-3"></div>

                <h2>Cadastrar Copa</h2>
                <p>Faça o cadastro da copa e defina suas regras</p>

                <form class="form-cadastrar">
                    <div class="section-form__etapa mt-4 mb-3">
                        <span>1ª Etapa</span>
                        <p>Dados da Copa</p>
                    </div>

                    <div class="row">
                        <div class="col-12 col-md-5 mb-3 mb-md-0">
                            <label for="nomeCopa" class="form-label">Nome da Copa*</label>
                            <input type="text" class="form-control" id="nomeCopa" name="nomeCopa"
                                placeholder="Ex: Catchau do relâmpago">
                        </div>

                        <div class="col-12 col-md-3 mb-3 mb-md-0">
                            <label for="status" class="form-label">Status*</label>
                            <select class="form-select" name="status" id="status" aria-label="Default select example">
                                <option selected disabled>Selecione...</option>
                                <option value="rua">Rua</option>
                                <option value="rally">Rally</option>
                                <option value="pista">Pista</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-4 campo-logo-copa">
                            <label class="form-label">Logo da Copa</label>
                            <input type="file" class="form-control logo-copa" id="logoCopa" name="logoCopa" hidden>
                            
                            <div class="">
                                <label for="logoCopa" class="label-selecionar-imagem">Selecionar Imagem</label>
                                <label>Nenhuma imagem selecionada</label>
                            </div>
                        </div>
                    </div>

                    <div class="section-form__adicionar-participante mt-4 mb-3">
                        <div class="section-form__etapa">
                            <span>2ª Etapa</span>
                            <p>Participantes</p>
                        </div>

                        <button class="btn-adicionar-participante"><i class="bi bi-plus-circle"></i> Adicionar
                            Participante</button>
                    </div>

                    <div class="row">
                        <div class="col-12 col-md-4 mb-3 mb-md-0">
                            <label for="participante1" class="form-label">Participante #1</label> 
                            
                            <i class="bi bi-trash ms-2"></i>
                            
                            <input type="text" class="form-control" id="participante1" name="participante1"
                                placeholder="Ex: Catchau do relâmpago">
                        </div>

                        <div class="col-12 col-md-4 mb-3 mb-md-0">
                            <label for="participante2" class="form-label">Participante #2</label>
                            
                            <i class="bi bi-trash ms-2"></i>
                            
                            <input type="text" class="form-control" id="participante2" name="participante2"
                                placeholder="Ex: Catchau do relâmpago">
                        </div>

                        <div class="col-12 col-md-4">
                            <label for="participante3" class="form-label">Participante #3</label> 
                            
                            <i class="bi bi-trash ms-2"></i>
                            
                            <input type="text" class="form-control" id="participante3" name="participante3"
                                placeholder="Ex: Catchau do relâmpago">
                        </div>
                    </div>

                    <div class="btn-atualizar">                        
                        <button class="btn mt-4 mb-2"><i class="bi bi-check2-circle"></i> Atualizar</button>
                    </div>
                </form>
            </section>
        </div>
    </div>

</div>
